name: Release & Auto-Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Changesets Automated Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Type Checks
        run: bun run check

      - name: Run Unit Tests
        run: bun test

      - name: Prepare & Version Packages
        id: prepare_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          CURRENT_VER=$(node -p "require('./packages/sdk/package.json').version")
          NPM_VER=$(npm info @thestudioxi/webmcp@$CURRENT_VER version 2>/dev/null || echo "")
          CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l | tr -d ' ')

          echo "Current package.json version: $CURRENT_VER"
          if [ -n "$NPM_VER" ]; then
            echo "NPM published version: $NPM_VER (matches local version)"
          else
            echo "NPM published version: not published yet or query returned empty"
          fi
          echo "Changeset files count: $CHANGESET_COUNT"

          # Auto-Patch Fallback:
          # If no changeset files exist in .changeset/ and the current package.json version is already
          # published on NPM (meaning code changes landed on main without a manual changeset or version bump),
          # generate an automatic patch changeset so this CI run bumps packages and releases to NPM.
          if [ "$CHANGESET_COUNT" -eq 0 ] && [ "$CURRENT_VER" = "$NPM_VER" ]; then
            echo "No explicit changeset found and version $CURRENT_VER is already published on NPM."
            echo "Generating automatic patch changeset..."
            printf '---\n"@thestudioxi/webmcp": patch\n"@thestudioxi/webmcp-adapter-express": patch\n"@thestudioxi/webmcp-adapter-hono": patch\n"@thestudioxi/webmcp-adapter-nest": patch\n"@thestudioxi/webmcp-adapter-vercel-ai": patch\n---\n\nauto: patch version release\n' > .changeset/auto-patch-release.md
          fi

          echo "Bumping versions with Changesets..."
          bun run version-packages

      - name: Build Packages
        run: bun run build

      - name: Publish to NPM & Sync Release Tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set! Please configure NPM_TOKEN in repository secrets."
            exit 1
          fi

          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

          echo "Publishing packages to NPM..."
          bun x changeset publish

          NEW_VER=$(node -p "require('./packages/sdk/package.json').version")
          echo "Committing version bump to $NEW_VER and syncing release tags..."
          git add .
          git commit -m "chore(release): v$NEW_VER" || echo "No version changes to commit"
          if ! git rev-parse "v$NEW_VER" >/dev/null 2>&1; then
            echo "Creating and pushing tag v$NEW_VER to main..."
            git tag -a "v$NEW_VER" -m "Release v$NEW_VER"
            git push origin main
            git push origin "v$NEW_VER"
          else
            echo "Tag v$NEW_VER already exists. Pushing main branch..."
            git push origin main
          fi

