<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- Network nodes — representing MCP connections -->
  <circle cx="20" cy="22" r="3.5" fill="white" opacity="0.9"/>
  <circle cx="44" cy="22" r="3.5" fill="white" opacity="0.9"/>
  <circle cx="32" cy="42" r="4.5" fill="white"/>
  <!-- Connection lines -->
  <line x1="22.5" y1="24" x2="29" y2="39" stroke="white" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
  <line x1="41.5" y1="24" x2="35" y2="39" stroke="white" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
  <line x1="23.5" y1="22" x2="40.5" y2="22" stroke="white" stroke-width="1.8" opacity="0.4" stroke-linecap="round" stroke-dasharray="2 3"/>
  <!-- Center pulse ring -->
  <circle cx="32" cy="42" r="8" fill="none" stroke="white" stroke-width="1.2" opacity="0.2"/>
</svg>
