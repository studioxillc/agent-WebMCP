name: Release & Auto-Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Changesets Automated Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Type Checks
        run: bun run check

      - name: Run Unit Tests
        run: bun test

      - name: Prepare & Version Packages
        id: prepare_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VER=$(node -p "require('./packages/sdk/package.json').version")
          NPM_VER=$(npm info @thestudioxi/webmcp@$CURRENT_VER version 2>/dev/null || echo "")
          CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l | tr -d ' ')

          echo "Current package.json version: $CURRENT_VER"
          if [ -n "$NPM_VER" ]; then
            echo "NPM published version: $NPM_VER (matches local version)"
          else
            echo "NPM published version: not published yet or query returned empty"
          fi
          echo "Changeset files count: $CHANGESET_COUNT"

          if [ "$CHANGESET_COUNT" -eq 0 ] && [ "$CURRENT_VER" = "$NPM_VER" ]; then
            echo "No explicit changeset found and version $CURRENT_VER is already published on NPM."
            echo "Generating automatic patch changeset..."
            cat << 'EOF' > .changeset/auto-patch-release.md
---
"@thestudioxi/webmcp": patch
"@thestudioxi/webmcp-adapter-express": patch
"@thestudioxi/webmcp-adapter-hono": patch
"@thestudioxi/webmcp-adapter-nest": patch
"@thestudioxi/webmcp-adapter-vercel-ai": patch
---

auto: patch version release
EOF
          fi

          echo "Bumping versions with Changesets..."
          bun run version-packages

      - name: Build Packages
        run: bun run build

      - name: Publish to NPM & Sync Release Tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set! Please configure NPM_TOKEN in repository secrets."
            exit 1
          fi

          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

          echo "Publishing packages to NPM..."
          bun x changeset publish

          if [ -n "$(git status --porcelain)" ]; then
            NEW_VER=$(node -p "require('./packages/sdk/package.json').version")
            echo "Committing version bump to $NEW_VER..."
            git add .
            git commit -m "chore(release): v$NEW_VER"
            git tag -a "v$NEW_VER" -m "Release v$NEW_VER"
            git push origin main --tags
          fi

