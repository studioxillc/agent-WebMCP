name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'bun run example:agent'
        2. Execute tool '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Operating System, Bun version, Node version, etc.
      value: |
        - OS: macOS / Linux / Windows
        - Bun Version: 1.3.x
        - Package: @webmcp/sdk
    validations:
      required: true
